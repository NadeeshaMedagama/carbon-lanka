version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:10"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(contracts)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"

