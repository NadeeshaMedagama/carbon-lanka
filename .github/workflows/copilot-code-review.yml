name: Copilot Code Review Helper

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-copilot-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Request Copilot review (best effort)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: ["copilot"]
              });
              core.info("Requested Copilot review.");
            } catch (error) {
              core.warning(`Copilot auto-request was not accepted: ${error.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: "Copilot review could not be auto-requested by workflow. If Copilot code review is enabled for this repository, request it from the PR UI."
              });
            }

